version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: namenology_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://namenology_user:namenology_secure_pass@db:5432/namenology_db?schema=public
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: namenology_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: namenology_user
      POSTGRES_PASSWORD: namenology_secure_pass
      POSTGRES_DB: namenology_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namenology_user -d namenology_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
