apiVersion: batch/v1
kind: Job
metadata:
  name: namenology-db-migrate
  labels:
    app: namenology-migration
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: namenology-migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: prisma-migrate
          image: namenology-web:latest # Same image as web
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef:
                name: namenology-config
            - secretRef:
                name: namenology-secret
